name: Student Resource Hub CI

on:
  push:
    paths:
      - "student-resource-hub/**"
      - ".github/workflows/student-resource-hub-ci.yml"
  pull_request:
    paths:
      - "student-resource-hub/**"
      - ".github/workflows/student-resource-hub-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-resource-hub
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/student_resource_hub"
      AUTH_SECRET: "ci-local-validation-secret-change-me-please"
      ADMIN_EMAIL: "ci@example.invalid"
      ADMIN_PASSWORD: "ci-local-only-validation-password"
      AUTH_TRUST_HOST: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
