name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub profile 3D contribution visual
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D contribution visual
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and publish generated visuals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "profile-3d/$GITHUB_RUN_ID"
          git add -A .
          if git diff --cached --quiet; then
            echo 'No 3D contribution changes to publish.'
            exit 0
          fi

          git commit -m 'chore(profile): refresh 3D contribution visuals'
          git push --set-upstream origin "profile-3d/$GITHUB_RUN_ID"

          gh pr create             --base main             --head "profile-3d/$GITHUB_RUN_ID"             --title 'chore(profile): refresh 3D contribution visuals'             --body 'Automated refresh of GitHub profile 3D contribution visuals.' ||             echo 'A pull request may already exist for this generated branch.'
