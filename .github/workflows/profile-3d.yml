name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub profile 3D contribution visual
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate 3D contribution visual
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push generated visuals
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "profile-3d/$GITHUB_RUN_ID"
          git add -A .
          if git commit -m "chore(profile): refresh 3D contribution visuals"; then
            git push --set-upstream origin "profile-3d/$GITHUB_RUN_ID"
          else
            echo "No 3D contribution changes to publish."
          fi
          echo "3D visuals generated and published to a dedicated branch. Open a pull request into main to publish them."
