name: Email Campaign Builder Security

on:
  push:
    paths:
      - "projects/email-campaign-builder/**"
      - ".github/workflows/email-campaign-builder-security.yml"
  pull_request:
    paths:
      - "projects/email-campaign-builder/**"
      - ".github/workflows/email-campaign-builder-security.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/email-campaign-builder

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/email-campaign-builder/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      - name: Security tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
