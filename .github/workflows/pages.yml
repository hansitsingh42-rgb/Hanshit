name: Deploy Student Projects

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'assets/**'
      - 'visitor-analytics/**'
      - 'demo/**'
      - 'jems/**'
      - 'projects/student-productivity-dashboard/**'
      - 'projects/study-resource-manager/**'
      - 'projects/c-student-record-manager/live-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          query = '''query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount contributionLevel}}}}}}'''
          payload = json.dumps({"query": query, "variables": {"login": "hansitsingh42-rgb"}}).encode()
          data = None

          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(
                      "https://api.github.com/graphql",
                      data=payload,
                      headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "Content-Type": "application/json",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2026-03-10",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)
                  break
              except Exception as exc:
                  if attempt == 3:
                      raise
                  print(f"Contribution request attempt {attempt} failed: {exc}; retrying...")
                  time.sleep(5)

          if data.get("errors"):
              raise SystemExit(f"GitHub GraphQL error: {data['errors']}")

          calendar = data.get("data", {}).get("user", {}).get("contributionsCollection", {}).get("contributionCalendar")
          if not calendar or not calendar.get("weeks"):
              raise SystemExit("GitHub returned an empty contribution calendar")

          days = sum(len(week.get("contributionDays", [])) for week in calendar["weeks"])
          if days < 300:
              raise SystemExit(f"Unexpected contribution calendar size: {days} days")

          with open("assets/contributions.json", "w", encoding="utf-8") as f:
              json.dump(calendar, f, separators=(",", ":"))
              f.write("\n")

          print(f"Fetched {calendar['totalContributions']} contributions across {len(calendar['weeks'])} weeks / {days} days")
          PY

      - name: Validate contribution data
        run: |
          python - <<'PY'
          import json
          with open('assets/contributions.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data.get('totalContributions'), int)
          assert isinstance(data.get('weeks'), list) and len(data['weeks']) >= 50
          assert all(len(w.get('contributionDays', [])) == 7 for w in data['weeks'])
          print('Contribution JSON validation passed')
          PY

      - name: Save refreshed contribution data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.json
          if git diff --cached --quiet; then
            echo "Contribution data is already up to date."
          else
            git commit -m "chore(profile): refresh GitHub contribution data"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/student-productivity-dashboard
          mkdir -p _site/study-resource-manager
          mkdir -p _site/visitor-analytics
          mkdir -p _site/demo
          mkdir -p _site/c-student-record-manager
          mkdir -p _site/jems

          cp index.html style.css script.js _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          cp -R projects/student-productivity-dashboard/. _site/student-productivity-dashboard/
          cp -R projects/study-resource-manager/. _site/study-resource-manager/
          cp -R visitor-analytics/. _site/visitor-analytics/
          cp -R demo/. _site/demo/
          cp -R projects/c-student-record-manager/live-demo/. _site/c-student-record-manager/
          cp -R jems/. _site/jems/

          test -f _site/index.html
          test -f _site/style.css
          test -f _site/script.js
          test -f _site/assets/contributions.js
          test -f _site/assets/contributions.css
          test -f _site/assets/contributions.json
          test -f _site/student-productivity-dashboard/index.html
          test -f _site/study-resource-manager/index.html
          test -f _site/visitor-analytics/index.html
          test -f _site/demo/index.html
          test -f _site/c-student-record-manager/index.html
          test -f _site/jems/index.html
          test -f _site/jems/style.css
          test -f _site/jems/script.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
