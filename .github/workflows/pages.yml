name: Deploy Student Projects

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'assets/**'
      - 'visitor-analytics/**'
      - 'demo/**'
      - 'jems/**'
      - 'projects/student-productivity-dashboard/**'
      - 'projects/study-resource-manager/**'
      - 'projects/c-student-record-manager/live-demo/**'
      - 'projects/advanced-weather-app/**'
      - 'projects/student-academic-planner/**'
      - 'projects/student-study-planner/**'
      - 'projects/student-resource-hub/**'
      - 'pdf-studio/**'
      - 'projects/**'
      - 'README.md'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/dependency-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/student-productivity-dashboard _site/study-resource-manager _site/visitor-analytics _site/demo
          mkdir -p _site/c-student-record-manager _site/jems _site/skycast _site/student-academic-planner
          mkdir -p _site/student-study-planner _site/student-resource-hub _site/pdf-studio _site/email-campaign-builder

          cp index.html style.css script.js _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          cp -R projects/student-productivity-dashboard/. _site/student-productivity-dashboard/
          cp -R projects/study-resource-manager/. _site/study-resource-manager/
          cp -R visitor-analytics/. _site/visitor-analytics/
          cp -R demo/. _site/demo/
          cp -R projects/c-student-record-manager/live-demo/. _site/c-student-record-manager/
          cp -R jems/. _site/jems/
          cp -R projects/advanced-weather-app/. _site/skycast/
          cp -R projects/student-academic-planner/. _site/student-academic-planner/
          cp -R projects/student-study-planner/. _site/student-study-planner/
          cp -R projects/student-resource-hub/. _site/student-resource-hub/
          cp -R pdf-studio/. _site/pdf-studio/
          cp -R projects/email-campaign-builder/. _site/email-campaign-builder/
          rm -rf _site/email-campaign-builder/api _site/email-campaign-builder/db _site/email-campaign-builder/lib _site/email-campaign-builder/test
          rm -f _site/email-campaign-builder/.env.example _site/email-campaign-builder/package.json _site/email-campaign-builder/package-lock.json

          test -f _site/index.html
          test -f _site/style.css
          test -f _site/script.js
          test -f _site/assets/contributions.js
          test -f _site/assets/contributions.css
          for f in             _site/student-productivity-dashboard/index.html             _site/study-resource-manager/index.html             _site/visitor-analytics/index.html             _site/demo/index.html             _site/c-student-record-manager/index.html             _site/jems/index.html _site/jems/style.css _site/jems/script.js             _site/skycast/index.html _site/skycast/style.css _site/skycast/script.js             _site/student-academic-planner/index.html _site/student-academic-planner/style.css             _site/student-academic-planner/script.js _site/student-academic-planner/interactions.js             _site/student-academic-planner/runtime-check.js             _site/student-study-planner/index.html _site/student-study-planner/style.css             _site/student-study-planner/script.js             _site/student-resource-hub/index.html _site/student-resource-hub/style.css             _site/student-resource-hub/script.js             _site/pdf-studio/index.html _site/pdf-studio/app.js             _site/pdf-studio/pdf-engine.js _site/pdf-studio/styles.css             _site/email-campaign-builder/index.html; do
            test -f "$f"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
