name: Deploy Student Projects

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'assets/**'
      - 'visitor-analytics/**'
      - 'demo/**'
      - 'jems/**'
      - 'projects/student-productivity-dashboard/**'
      - 'projects/study-resource-manager/**'
      - 'projects/c-student-record-manager/live-demo/**'
      - 'projects/advanced-weather-app/**'
      - 'projects/student-academic-planner/**'
      - 'projects/student-resource-hub/**'
      - 'pdf-studio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Build the portfolio site and publish each standalone student project.
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/student-productivity-dashboard
          mkdir -p _site/study-resource-manager
          mkdir -p _site/visitor-analytics
          mkdir -p _site/demo
          mkdir -p _site/c-student-record-manager
          mkdir -p _site/jems
          mkdir -p _site/skycast
          mkdir -p _site/student-academic-planner
          mkdir -p _site/student-resource-hub
          mkdir -p _site/pdf-studio

          cp index.html style.css script.js _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          cp -R projects/student-productivity-dashboard/. _site/student-productivity-dashboard/
          cp -R projects/study-resource-manager/. _site/study-resource-manager/
          cp -R visitor-analytics/. _site/visitor-analytics/
          cp -R demo/. _site/demo/
          cp -R projects/c-student-record-manager/live-demo/. _site/c-student-record-manager/
          cp -R jems/. _site/jems/
          cp -R projects/advanced-weather-app/. _site/skycast/
          cp -R projects/student-academic-planner/. _site/student-academic-planner/
          cp -R projects/student-resource-hub/. _site/student-resource-hub/
          cp -R pdf-studio/. _site/pdf-studio/

          test -f _site/index.html
          test -f _site/style.css
          test -f _site/script.js
          test -f _site/assets/contributions.js
          test -f _site/assets/contributions.css
          test -f _site/student-productivity-dashboard/index.html
          test -f _site/study-resource-manager/index.html
          test -f _site/visitor-analytics/index.html
          test -f _site/demo/index.html
          test -f _site/c-student-record-manager/index.html
          test -f _site/jems/index.html
          test -f _site/jems/style.css
          test -f _site/jems/script.js
          test -f _site/skycast/index.html
          test -f _site/skycast/style.css
          test -f _site/skycast/script.js
          test -f _site/student-academic-planner/index.html
          test -f _site/student-academic-planner/style.css
          test -f _site/student-academic-planner/script.js
          test -f _site/student-academic-planner/interactions.js
          test -f _site/student-academic-planner/runtime-check.js
          test -f _site/student-resource-hub/index.html
          test -f _site/student-resource-hub/style.css
          test -f _site/student-resource-hub/script.js
          test -f _site/pdf-studio/index.html
          test -f _site/pdf-studio/app.js
          test -f _site/pdf-studio/pdf-engine.js
          test -f _site/pdf-studio/styles.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
