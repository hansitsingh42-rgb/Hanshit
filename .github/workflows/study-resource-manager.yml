name: Study Resource Manager Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/study-resource-manager/**"
      - ".github/workflows/study-resource-manager.yml"
  push:
    branches: [main]
    paths:
      - "projects/study-resource-manager/**"
      - ".github/workflows/study-resource-manager.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check resource form selector regression
        run: node projects/study-resource-manager/tests/smoke.cjs
