name: Update profile analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'README.md'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-profile-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub analytics cards
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&include_all_commits=true
          path: assets/github-stats.svg
          token: ${{ github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6
          path: assets/github-top-langs.svg
          token: ${{ github.token }}

      - name: Generate contribution streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&disable_animations=true&date_format=j%20M%5B%20Y%5D
          path: assets/github-streak.svg
          token: ${{ github.token }}

      - name: Generate contribution graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: 'theme=github&hide_border=true&area=true&custom_title=Contribution%20Activity'
          output_path: assets/github-contribution-graph.svg
          token: ${{ github.token }}

      - name: Publish analytics branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/github-top-langs.svg assets/github-streak.svg assets/github-contribution-graph.svg; then
            echo 'No analytics changes to publish.'
            exit 0
          fi

          branch="profile-analytics/${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add assets/github-stats.svg assets/github-top-langs.svg assets/github-streak.svg assets/github-contribution-graph.svg
          git commit -m 'chore(profile): refresh GitHub analytics'
          git push --set-upstream origin "$branch"

          echo "Analytics generated and published to branch: $branch"
          echo "Open a pull request from $branch into main to publish the refreshed cards."
