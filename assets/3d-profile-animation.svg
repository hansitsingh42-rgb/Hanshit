<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated 3D developer visual">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset=".55" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern>
</defs>
<rect width="900" height="260" rx="26" fill="url(#bg)"/>
<rect x="18" y="18" width="864" height="224" rx="18" fill="url(#grid)"/>
<ellipse cx="700" cy="130" rx="190" ry="105" fill="#6366f1" opacity=".12" filter="url(#soft)"><animate attributeName="opacity" values=".06;.18;.06" dur="5s" repeatCount="indefinite"/></ellipse>
<g transform="translate(690 130)" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".9" filter="url(#glow)">
  <ellipse rx="78" ry="78"/><ellipse rx="78" ry="36"/><ellipse rx="78" ry="16"/><ellipse rx="36" ry="78"/><ellipse rx="16" ry="78"/><path d="M-78 0H78M0-78V78"/>
  <animateTransform attributeName="transform" type="rotate" from="0 690 130" to="360 690 130" dur="14s" repeatCount="indefinite"/>
</g>
<g transform="translate(570 48)"><path d="M0 18L28 2L56 18L28 34Z" fill="#818cf8"/><path d="M0 18V50L28 66V34Z" fill="#4f46e5"/><path d="M56 18V50L28 66V34Z" fill="#a5b4fc"/><animateTransform attributeName="transform" type="translate" values="570 48;570 38;570 48" dur="3s" repeatCount="indefinite"/></g>
