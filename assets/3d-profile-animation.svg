<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" role="img" aria-label="Hanshit Singh animated GitHub profile">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040a"/><stop offset=".55" stop-color="#071426"/><stop offset="1" stop-color="#020617"/></linearGradient>
<linearGradient id="ac"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="gl"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".55"/></filter>
<clipPath id="photo"><rect x="720" y="48" width="380" height="424" rx="30"/></clipPath>
</defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<rect x="14" y="14" width="1172" height="492" rx="24" fill="url(#grid)"/>
<ellipse cx="900" cy="260" rx="330" ry="260" fill="url(#gl)"><animate attributeName="rx" values="300;350;300" dur="7s" repeatCount="indefinite"/></ellipse>
<g transform="translate(910 260)" fill="none" stroke="url(#ac)" filter="url(#glow)">
<ellipse rx="205" ry="205" stroke-width="2" opacity=".4"/>
<ellipse rx="205" ry="92" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></ellipse>
<ellipse rx="92" ry="205" stroke-width="1.8" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/></ellipse>
<ellipse rx="150" ry="52" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></ellipse>
</g>
<g filter="url(#shadow)">
<rect x="720" y="48" width="380" height="424" rx="30" fill="#020617" stroke="#38bdf8" stroke-opacity=".3"/>
<image x="720" y="48" width="380" height="424" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)" href="https://avatars.githubusercontent.com/u/318280419?v=4" xlink:href="https://avatars.githubusercontent.com/u/318280419?v=4"/>
<rect x="720" y="48" width="380" height="424" rx="30" fill="#071426" opacity=".12"/>
<rect x="720" y="48" width="380" height="424" rx="30" fill="none" stroke="url(#ac)" stroke-width="2"/>
</g>
<g fill="#67e8f9" filter="url(#glow)">
<circle cx="680" cy="115" r="2"><animate attributeName="cx" values="680;720;680" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="650" cy="175" r="1.7"><animate attributeName="cy" values="175;140;175" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="695" cy="235" r="2.2"><animate attributeName="cx" values="695;730;695" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="660" cy="305" r="1.6"><animate attributeName="cx" values="660;710;660" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="690" cy="385" r="2"><animate attributeName="cy" values="385;350;385" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,Helvetica,sans-serif">
<text x="72" y="78" fill="#a5f3fc" font-size="15" letter-spacing="4" font-weight="700">WELCOME TO MY GITHUB</text>
<line x1="72" y1="96" x2="355" y2="96" stroke="url(#ac)" stroke-width="2"/>
<text x="72" y="160" fill="#f8fafc" font-size="27">Hi, I'm</text>
<text x="72" y="214" fill="#fff" font-size="54" font-weight="800">HANSHIT</text>
<text x="72" y="264" fill="#38bdf8" font-size="50" font-weight="800">SINGH</text>
<text x="74" y="301" fill="#cbd5e1" font-size="17" letter-spacing="5" font-weight="700">CSE DIPLOMA STUDENT</text>
<text x="74" y="342" fill="#94a3b8" font-size="16">Turning ideas into code, and learning into progress.</text>
<g transform="translate(72 382)"><rect width="104" height="44" rx="12" fill="#071426" stroke="#38bdf8" stroke-opacity=".38"/><text x="52" y="28" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">BUILD</text><rect x="116" width="104" height="44" rx="12" fill="#071426" stroke="#38bdf8" stroke-opacity=".28"/><text x="168" y="28" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="700">LEARN</text><rect x="232" width="104" height="44" rx="12" fill="#071426" stroke="#a78bfa" stroke-opacity=".28"/><text x="284" y="28" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">CREATE</text></g>
<text x="74" y="468" fill="#64748b" font-family="monospace" font-size="13">C • JAVASCRIPT • WEB • GIT/GITHUB • AI</text>
