<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Hanshit Singh cyberpunk developer profile hero">
<defs>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020712" stop-opacity=".18"/><stop offset=".55" stop-color="#00101d" stop-opacity=".05"/><stop offset="1" stop-color="#02040a" stop-opacity=".28"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".42"/><stop offset=".45" stop-color="#3b82f6" stop-opacity=".16"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring"><stop stop-color="#67e8f9"/><stop offset=".45" stop-color="#2563eb"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".055"/></pattern>
  <clipPath id="clip"><rect width="1200" height="675" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <image href="https://raw.githubusercontent.com/hansitsingh42-rgb/Hanshit/main/assets/cyberpunk-hero.jpg" x="0" y="0" width="1200" height="675" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="675" fill="url(#shade)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity=".8"/>
  <ellipse cx="760" cy="345" rx="310" ry="280" fill="url(#glow)" opacity=".28"><animate attributeName="opacity" values=".18;.34;.18" dur="5s" repeatCount="indefinite"/></ellipse>

  <g transform="translate(760 345)" fill="none" stroke="url(#ring)" filter="url(#soft)" opacity=".78">
    <ellipse rx="230" ry="92" stroke-width="2.2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="92" ry="230" stroke-width="1.7" opacity=".72"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="175" ry="55" stroke-width="2" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></ellipse>
  </g>

  <g fill="#67e8f9">
    <circle cx="90" cy="90" r="2.4"><animate attributeName="cy" values="90;62;90" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="535" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="75" r="2.2"><animate attributeName="cx" values="470;495;470" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="120" r="2.5"><animate attributeName="cy" values="120;145;120" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="520" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="570" r="2.2"><animate attributeName="cx" values="650;680;650" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#b9f7ff" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M28 62V28H62" stroke-width="2"/><path d="M1138 28H1172V62" stroke-width="2"/>
    <path d="M28 613V647H62" stroke-width="2"/><path d="M1138 647H1172V613" stroke-width="2"/>
    <path d="M70 112h52" stroke-width="1" opacity=".7"><animate attributeName="x2" values="122;160;122" dur="4s" repeatCount="indefinite"/></path>
    <path d="M1080 560h58" stroke-width="1" opacity=".7"><animate attributeName="x2" values="1138;1100;1138" dur="4s" repeatCount="indefinite"/></path>
  </g>

  <g opacity=".18" filter="url(#blur)"><rect x="0" y="0" width="1200" height="3" fill="#67e8f9"><animate attributeName="y" values="0;672;0" dur="6s" repeatCount="indefinite"/></rect></g>
  <g opacity=".32"><rect x="0" y="0" width="1200" height="1.5" fill="#8be9ff"><animate attributeName="y" values="0;675" dur="7s" repeatCount="indefinite"/></rect></g>

  <g transform="translate(600 337.5)">
    <circle r="265" fill="none" stroke="#22d3ee" stroke-opacity=".12" stroke-width="1"><animate attributeName="r" values="255;275;255" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#e0f7ff">
    <g transform="translate(52 50)">
      <circle cx="10" cy="10" r="7" fill="none" stroke="#67e8f9" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#67e8f9"/>
      <text x="27" y="15" font-size="14" letter-spacing="3" opacity=".9">HANSHIT SINGH • DEVELOPER PROFILE</text>
    </g>
    <text x="53" y="625" font-size="12" letter-spacing="4" opacity=".7">CODE • LEARN • BUILD • GROW</text>
  </g>

  <rect x="12" y="12" width="1176" height="651" rx="24" fill="none" stroke="#67e8f9" stroke-opacity=".38" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values=".22;.58;.22" dur="4s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>