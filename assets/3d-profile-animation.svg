<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated 3D developer visual">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02040a"/><stop offset=".45" stop-color="#071426"/><stop offset="1" stop-color="#020617"/></linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity=".11"/></pattern>
</defs>
<rect width="900" height="260" rx="26" fill="url(#bg)"/>
<circle cx="690" cy="130" r="175" fill="url(#orb)" filter="url(#soft)"><animate attributeName="r" values="150;185;150" dur="6s" repeatCount="indefinite"/></circle>
<rect x="18" y="18" width="864" height="224" rx="18" fill="url(#grid)"/>
<path d="M0 220 Q220 150 430 220 T900 160" fill="none" stroke="#38bdf8" stroke-opacity=".12"/>
<g transform="translate(690 130)" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".95" filter="url(#glow)">
  <ellipse rx="78" ry="78"/><ellipse rx="78" ry="36"/><ellipse rx="78" ry="16"/><ellipse rx="36" ry="78"/><ellipse rx="16" ry="78"/><path d="M-78 0H78M0-78V78"/>
  <animateTransform attributeName="transform" type="rotate" from="0 690 130" to="360 690 130" dur="12s" repeatCount="indefinite"/>
</g>
<g transform="translate(560 50)"><path d="M0 18L28 2L56 18L28 34Z" fill="#60a5fa"/><path d="M0 18V50L28 66V34Z" fill="#2563eb"/><path d="M56 18V50L28 66V34Z" fill="#a5f3fc"/><animateTransform attributeName="transform" type="translate" values="560 50;560 38;560 50" dur="3s" repeatCount="indefinite"/></g>
<g transform="translate(790 70) scale(.7)"><path d="M0 18L28 2L56 18L28 34Z" fill="#a78bfa"/><path d="M0 18V50L28 66V34Z" fill="#7c3aed"/><path d="M56 18V50L28 66V34Z" fill="#c4b5fd"/><animateTransform attributeName="transform" type="translate" values="790 70;790 56;790 70" dur="4s" repeatCount="indefinite"/></g>
<g fill="#67e8f9"><circle cx="520" cy="72" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="845" cy="175" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="620" cy="225" r="2"/></g>
<text x="60" y="78" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">HANSHIT SINGH</text>
<text x="62" y="112" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="17">CSE STUDENT • BUILDER • TECH EXPLORER</text>
<text x="62" y="162" fill="url(#accent)" font-family="monospace" font-size="20" font-weight="700">LEARN → BUILD → IMPROVE</text>
<text x="62" y="191" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="14">AI • WEB • GIT/GITHUB • COMPUTER NETWORKS</text>
<rect x="60" y="214" width="330" height="2" rx="1" fill="url(#accent)"><animate attributeName="width" values="120;330;120" dur="4s" repeatCount="indefinite"/></rect>
</svg>