<g fill="#93c5fd"><circle cx="420" cy="70" r="1.6"><animate attributeName="cy" values="70;35;70" dur="5s" repeatCount="indefinite"/></circle><circle cx="510" cy="455" r="1.4"><animate attributeName="cx" values="510;540;510" dur="4s" repeatCount="indefinite"/></circle><circle cx="585" cy="110" r="1.5"><animate attributeName="cy" values="110;145;110" dur="3.7s" repeatCount="indefinite"/></circle></g>
<g filter="url(#glow)" transform="translate(1035 82)"><rect width="92" height="52" rx="13" fill="#071426" stroke="#38bdf8" stroke-opacity=".7"/><text x="46" y="32" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="16" font-weight="700">&lt;/&gt;</text><animateTransform attributeName="transform" type="translate" values="1035 82;1035 70;1035 82" dur="3.8s" repeatCount="indefinite"/></g>
<rect width="1200" height="520" rx="30" fill="#02040a"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.08;.24;1" dur="2.8s" fill="freeze"/></rect>
<text x="600" y="274" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="14" letter-spacing="5" opacity="0">INITIALIZING PROFILE...<animate attributeName="opacity" values="0;1;0" dur="2.2s" fill="freeze"/></text>
