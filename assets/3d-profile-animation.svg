<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated 3D developer visual">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b31"/>
  </linearGradient>
  <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="260" rx="28" fill="url(#bg)"/>
<g opacity=".22" fill="none" stroke="#94a3b8">
  <path d="M0 210L900 40M0 250L900 80M100 260L900 110"/>
</g>
<g transform="translate(450 130)" filter="url(#glow)">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    <path d="M0-72L72-36V36L0 72L-72 36V-36Z" fill="none" stroke="url(#cube)" stroke-width="4"/>
    <path d="M0-72V0M-72-36L0 0L72-36M0 0V72" fill="none" stroke="#67e8f9" stroke-width="3" opacity=".9"/>
  </g>
  <circle r="90" fill="none" stroke="#7c3aed" stroke-width="2" opacity=".35">
    <animate attributeName="r" values="90;112;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;.08;.35" dur="3s" repeatCount="indefinite"/>
  </circle>
</g>
<g fill="#e2e8f0" font-family="Arial, sans-serif" text-anchor="middle">
  <text x="450" y="228" font-size="20" letter-spacing="4">BUILD • LEARN • CREATE</text>
</g>
<g fill="#67e8f9" opacity=".8">
  <circle cx="90" cy="65" r="3"><animate attributeName="cy" values="65;48;65" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="810" cy="190" r="3"><animate attributeName="cy" values="190;172;190" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="130" cy="190" r="2"><animate attributeName="cx" values="130;155;130" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
</svg>
