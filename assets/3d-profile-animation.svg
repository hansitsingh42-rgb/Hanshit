<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Hanshit Singh cyberpunk animated profile hero">
<defs>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <filter id="softGlow"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="particleGlow"><feGaussianBlur stdDeviation="1.4"/></filter>
  <clipPath id="frame"><rect width="1200" height="675" rx="26"/></clipPath>
  <clipPath id="reveal"><circle cx="600" cy="337.5" r="0"><animate attributeName="r" values="0;150;420;760" keyTimes="0;.16;.58;1" dur="2.7s" fill="freeze"/></circle></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="675" fill="#050816"/>

  <!-- Supplied cyberpunk artwork: kept as the actual hero visual. -->
  <g clip-path="url(#reveal)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-.45 600 337.5;0 600 337.5;.45 600 337.5;0 600 337.5" dur="11s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="scale" values="1;1.006;1;.997;1" dur="11s" repeatCount="indefinite"/>
      <image href="https://raw.githubusercontent.com/hansitsingh42-rgb/Hanshit/main/assets/cyberpunk-hero.jpg?v=20260913-2" x="0" y="0" width="1200" height="675" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>

  <!-- Subtle 3D orbit layer -->
  <g transform="translate(600 337.5)" fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <ellipse rx="330" ry="112" stroke-width="2.1" opacity=".58" filter="url(#softGlow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="120" ry="300" stroke-width="1.6" opacity=".44" filter="url(#softGlow)"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="270" ry="78" stroke-width="1.3" opacity=".38"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- Particles -->
  <g fill="#9bf6ff" filter="url(#particleGlow)">
    <circle cx="600" cy="337.5" r="3"><animate attributeName="r" values="2;9;2" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.12;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="270" r="2"><animate attributeName="cx" values="510;450;510" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="270;215;270" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="270" r="2"><animate attributeName="cx" values="690;750;690" dur="4.5s" repeatCount="indefinite"/><animate attributeName="cy" values="270;210;270" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="515" cy="415" r="2"><animate attributeName="cx" values="515;450;515" dur="4.2s" repeatCount="indefinite"/><animate attributeName="cy" values="415;480;415" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="685" cy="415" r="2"><animate attributeName="cx" values="685;750;685" dur="4.1s" repeatCount="indefinite"/><animate attributeName="cy" values="415;475;415" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="145" r="2"/><circle cx="905" cy="145" r="2"/><circle cx="250" cy="520" r="2"/><circle cx="950" cy="510" r="2"/>
  </g>

  <!-- Minimal HUD / scan sweep -->
  <g stroke="#b9f7ff" fill="none" stroke-linecap="round" opacity=".72">
    <path d="M28 62V28H62M1138 28H1172V62M28 613V647H62M1138 647H1172V613" stroke-width="2"/>
  </g>
  <rect x="0" y="0" width="1200" height="2" fill="#9bf6ff" opacity=".22"><animate attributeName="y" values="0;673;0" dur="7s" repeatCount="indefinite"/></rect>
  <rect x="12" y="12" width="1176" height="651" rx="24" fill="none" stroke="url(#orbit)" stroke-width="1.2" stroke-opacity=".4"><animate attributeName="stroke-opacity" values=".25;.6;.25" dur="5s" repeatCount="indefinite"/></rect>
</g>
</svg>
