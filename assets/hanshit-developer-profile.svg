<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Hanshit Singh — CSE Student Developer Profile</title>
  <desc id="desc">An animated GitHub-dark developer identity card with a subtle perspective grid, depth layers, ambient glow, and developer profile information.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset=".48" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <radialGradient id="aurora" cx="78%" cy="18%" r="72%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset=".32" stop-color="#7c3aed" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#79c0ff" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#58a6ff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset=".46" stop-color="#58a6ff"/>
      <stop offset=".7" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-width="1" opacity=".055"/>
    </pattern>
    <pattern id="fineGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#fff" stroke-width=".6" opacity=".018"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="card"><rect x="12" y="12" width="1156" height="536" rx="20"/></clipPath>

    <style>
      .mono{font-family:Courier New,Consolas,monospace}
      .label{fill:#8b949e;font-size:14px;letter-spacing:2px}
      .value{fill:#f0f6fc;font-size:22px;font-weight:700}
      .small{fill:#c9d1d9;font-size:16px}
      .accent{fill:#79c0ff}
      .dim{fill:#8b949e}
      .node{fill:#58a6ff}
      .ambient{animation:ambient 7s ease-in-out infinite alternate}
      .drift{animation:drift 16s linear infinite}
      .float{animation:float 6s ease-in-out infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .shine{animation:shine 8s ease-in-out infinite}
      @keyframes ambient{from{opacity:.35;transform:translate(0,0)}to{opacity:.75;transform:translate(12px,-8px)}}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-32px,32px)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
      @keyframes shine{0%,55%{transform:translateX(-430px);opacity:0}65%{opacity:.8}80%,100%{transform:translateX(1200px);opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1180" height="560" fill="url(#bg)"/>
    <rect width="1180" height="560" fill="url(#aurora)"/>

    <!-- Depth / pseudo-3D perspective field -->
    <g class="drift" opacity=".72">
      <rect x="-80" y="100" width="1340" height="520" fill="url(#grid)" transform="skewY(-5)"/>
      <path d="M0 520 Q590 300 1180 520" fill="none" stroke="#58a6ff" stroke-width="1" opacity=".08"/>
      <path d="M0 550 Q590 330 1180 550" fill="none" stroke="#a371f7" stroke-width="1" opacity=".055"/>
    </g>
    <rect width="1180" height="560" fill="url(#fineGrid)"/>

    <!-- Ambient 3D light volumes -->
    <circle class="ambient" cx="1010" cy="110" r="150" fill="url(#orb)" filter="url(#soft)"/>
    <circle class="float" cx="930" cy="92" r="3" fill="#79c0ff" filter="url(#glow)"/>
    <circle class="pulse" cx="1060" cy="155" r="2.5" fill="#a371f7" filter="url(#glow)"/>
    <circle class="float" cx="870" cy="185" r="2" fill="#58a6ff" opacity=".7"/>

    <!-- Orbit rings -->
    <g transform="translate(1025 150)" opacity=".42">
      <ellipse rx="118" ry="38" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 9" transform="rotate(-18)"/>
      <ellipse rx="88" ry="28" fill="none" stroke="#a371f7" stroke-width="1" stroke-dasharray="3 8" transform="rotate(34)"/>
      <circle r="5" fill="#79c0ff" filter="url(#glow)"/>
    </g>

    <rect x="12" y="12" width="1156" height="536" rx="20" fill="none" stroke="url(#edge)" stroke-width="2"/>

    <!-- Browser / terminal header -->
    <rect x="28" y="28" width="1124" height="42" rx="10" fill="#11161f" fill-opacity=".94" stroke="#30363d"/>
    <circle cx="48" cy="49" r="5" fill="#8b949e"/>
    <circle cx="66" cy="49" r="5" fill="#8b949e"/>
    <circle cx="84" cy="49" r="5" fill="#8b949e"/>
    <text x="110" y="55" class="mono small">hanshit@cse ~ % ./profile</text>
    <circle cx="1020" cy="49" r="4" class="pulse" fill="#3fb950"/>
    <text x="1035" y="55" class="mono accent" font-size="14">BUILDING</text>

    <!-- Left information panel -->
    <rect x="28" y="88" width="480" height="420" rx="14" fill="#090d13" fill-opacity=".9" stroke="#30363d"/>
    <rect x="29" y="89" width="478" height="418" rx="13" fill="url(#aurora)" opacity=".24"/>
    <text x="52" y="121" class="mono label">IDENTITY / HANSHIT</text>
    <text x="52" y="176" class="mono value">HANSHIT SINGH</text>
    <text x="52" y="207" class="mono small accent">CSE STUDENT / DEVELOPER</text>
    <line x1="52" y1="230" x2="484" y2="230" stroke="#30363d"/>

    <text x="52" y="263" class="mono label">FOCUS</text>
    <text x="52" y="291" class="mono small">Web Development</text>
    <text x="52" y="316" class="mono small">C Programming</text>
    <text x="52" y="341" class="mono small">JavaScript</text>
    <text x="52" y="366" class="mono small">Computer Science</text>

    <text x="52" y="407" class="mono label">MODE</text>
    <text x="52" y="437" class="mono small">Learning → Building</text>
    <text x="52" y="462" class="mono small">Testing → Securing</text>
    <text x="52" y="487" class="mono small">Improving → Repeating</text>

    <!-- Right information panel -->
    <rect x="528" y="88" width="624" height="420" rx="14" fill="#090d13" fill-opacity=".9" stroke="#30363d"/>
    <text x="554" y="121" class="mono label">PROFILE / BUILDER</text>
    <text x="554" y="160" class="mono small"><tspan class="dim">Education:</tspan> Polytechnic Computer Science</text>
    <text x="554" y="187" class="mono small"><tspan class="dim">Builds:</tspan> Student tools · Web projects</text>
    <text x="554" y="214" class="mono small"><tspan class="dim">Explores:</tspan> AI · UI/UX · Git &amp; GitHub</text>

    <text x="554" y="260" class="mono label">SELECTED WORK</text>
    <g class="float">
      <text x="554" y="290" class="mono small"><tspan class="accent">01</tspan> Student Resource Hub</text>
      <text x="554" y="318" class="mono small"><tspan class="accent">02</tspan> SKH Cast+ Weather Dashboard</text>
    </g>
    <text x="554" y="346" class="mono small"><tspan class="accent">03</tspan> C Student Record Manager</text>
    <text x="554" y="374" class="mono small"><tspan class="accent">04</tspan> Jems AI</text>
    <text x="554" y="402" class="mono small"><tspan class="accent">05</tspan> Student Study Planner</text>

    <line x1="554" y1="428" x2="1124" y2="428" stroke="#30363d"/>
    <text x="554" y="458" class="mono label">QUALITY</text>
    <text x="554" y="485" class="mono small">Build → Test → Secure → Document</text>

    <!-- Subtle animated light sweep -->
    <rect class="shine" x="-430" y="12" width="240" height="536" fill="url(#shine)" transform="skewX(-16)" opacity=".35"/>

    <!-- Fine foreground accents -->
    <path d="M28 326H508M528 326H1152" stroke="#58a6ff" stroke-width="2" opacity=".12"/>
    <path d="M28 507H1152" stroke="#58a6ff" stroke-width="1" opacity=".1"/>
  </g>
</svg>