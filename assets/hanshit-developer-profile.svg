<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Hanshit Singh — CSE Student Developer Profile</title>
  <desc id="desc">A GitHub-dark developer identity card showing Hanshit Singh's CSE focus, current build areas, selected projects, and learning workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#58a6ff" opacity=".035"/>
    </pattern>
    <style>
      .mono{font-family:Courier New,Consolas,monospace}
      .label{fill:#8b949e;font-size:15px;letter-spacing:2px}
      .value{fill:#f0f6fc;font-size:22px;font-weight:700}
      .small{fill:#c9d1d9;font-size:16px}
      .accent{fill:#79c0ff}
      .dim{fill:#8b949e}
    </style>
    <clipPath id="card"><rect x="12" y="12" width="1156" height="536" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1180" height="560" fill="url(#bg)"/>
    <rect width="1180" height="560" fill="url(#grid)"/>
    <rect width="1180" height="560" fill="url(#scanlines)"/>
    <rect x="12" y="12" width="1156" height="536" rx="18" fill="none" stroke="url(#line)" stroke-width="2"/>

    <rect x="28" y="28" width="1124" height="42" rx="9" fill="#161b22" stroke="#30363d"/>
    <circle cx="48" cy="49" r="5" fill="#8b949e"/><circle cx="66" cy="49" r="5" fill="#8b949e"/><circle cx="84" cy="49" r="5" fill="#8b949e"/>
    <text x="110" y="55" class="mono small">hanshit@cse ~ % ./profile</text>
    <text x="1035" y="55" class="mono accent" font-size="14">BUILDING</text>

    <rect x="28" y="88" width="480" height="420" rx="14" fill="#0d1117" stroke="#30363d"/>
    <text x="52" y="121" class="mono label">IDENTITY / HANSHiT</text>
    <text x="52" y="176" class="mono value">HANSHiT SINGH</text>
    <text x="52" y="207" class="mono small accent">CSE STUDENT / DEVELOPER</text>
    <line x1="52" y1="230" x2="484" y2="230" stroke="#30363d"/>

    <text x="52" y="263" class="mono label">FOCUS</text>
    <text x="52" y="291" class="mono small">Web Development</text>
    <text x="52" y="316" class="mono small">C Programming</text>
    <text x="52" y="341" class="mono small">JavaScript</text>
    <text x="52" y="366" class="mono small">Computer Science</text>

    <text x="52" y="407" class="mono label">MODE</text>
    <text x="52" y="437" class="mono small">Learning → Building</text>
    <text x="52" y="462" class="mono small">Testing → Securing</text>
    <text x="52" y="487" class="mono small">Improving → Repeating</text>

    <rect x="528" y="88" width="624" height="420" rx="14" fill="#0d1117" stroke="#30363d"/>
    <text x="554" y="121" class="mono label">PROFILE / BUILDER</text>
    <text x="554" y="160" class="mono small"><tspan class="dim">Education:</tspan> Polytechnic Computer Science</text>
    <text x="554" y="187" class="mono small"><tspan class="dim">Builds:</tspan> Student tools · Web projects</text>
    <text x="554" y="214" class="mono small"><tspan class="dim">Explores:</tspan> AI · UI/UX · Git &amp; GitHub</text>

    <text x="554" y="260" class="mono label">SELECTED WORK</text>
    <text x="554" y="290" class="mono small"><tspan class="accent">01</tspan> Student Resource Hub</text>
    <text x="554" y="318" class="mono small"><tspan class="accent">02</tspan> SKH Cast+ Weather Dashboard</text>
    <text x="554" y="346" class="mono small"><tspan class="accent">03</tspan> C Student Record Manager</text>
    <text x="554" y="374" class="mono small"><tspan class="accent">04</tspan> Jems AI</text>
    <text x="554" y="402" class="mono small"><tspan class="accent">05</tspan> Student Study Planner</text>

    <line x1="554" y1="428" x2="1124" y2="428" stroke="#30363d"/>
    <text x="554" y="458" class="mono label">QUALITY</text>
    <text x="554" y="485" class="mono small">Build → Test → Secure → Document</text>

    <rect x="28" y="326" width="1124" height="2" fill="#58a6ff" opacity=".22"/>
  </g>
</svg>