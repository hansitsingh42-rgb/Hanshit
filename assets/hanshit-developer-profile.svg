<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Hanshit Singh — CSE Student Developer Profile</title>
  <desc id="desc">A GitHub-dark developer identity card with layered depth, perspective grid, ambient glow, orbit details, selected projects, and a secure build workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset=".48" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171d27"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="28%" r="68%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset=".42" stop-color="#58a6ff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#79c0ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#79c0ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#58a6ff" opacity=".035"/>
    </pattern>
    <pattern id="microgrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#58a6ff" stroke-width=".6" opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="card"><rect x="12" y="12" width="1156" height="536" rx="18"/></clipPath>
    <clipPath id="leftPanel"><rect x="28" y="88" width="480" height="420" rx="14"/></clipPath>
    <clipPath id="rightPanel"><rect x="528" y="88" width="624" height="420" rx="14"/></clipPath>
    <style>
      .mono{font-family:Courier New,Consolas,monospace}
      .label{fill:#8b949e;font-size:15px;letter-spacing:2px}
      .value{fill:#f0f6fc;font-size:22px;font-weight:700}
      .small{fill:#c9d1d9;font-size:16px}
      .accent{fill:#79c0ff}
      .dim{fill:#8b949e}
      .muted{fill:#6e7681}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1180" height="560" fill="url(#bg)"/>
    <rect width="1180" height="560" fill="url(#halo)"/>
    <rect width="1180" height="560" fill="url(#grid)"/>
    <rect width="1180" height="560" fill="url(#scanlines)"/>

    <!-- pseudo-3D perspective floor -->
    <g opacity=".26" transform="translate(0 372) skewX(-18)">
      <rect x="-80" y="0" width="1340" height="230" fill="url(#microgrid)"/>
      <path d="M0 8H1180M0 52H1180M0 102H1180M0 158H1180M0 220H1180" stroke="#58a6ff" stroke-width="1" opacity=".16"/>
    </g>

    <!-- ambient depth orbits -->
    <g fill="none" stroke="#58a6ff" opacity=".12">
      <ellipse cx="970" cy="215" rx="245" ry="82" transform="rotate(-18 970 215)"/>
      <ellipse cx="970" cy="215" rx="205" ry="68" transform="rotate(-18 970 215)"/>
      <ellipse cx="970" cy="215" rx="155" ry="51" transform="rotate(-18 970 215)"/>
    </g>
    <g fill="#79c0ff" filter="url(#glow)" opacity=".7">
      <circle cx="1130" cy="135" r="3"/>
      <circle cx="875" cy="284" r="2.5"/>
      <circle cx="1030" cy="118" r="2"/>
      <circle cx="720" cy="95" r="2"/>
    </g>

    <!-- outer frame / glass edge -->
    <rect x="12" y="12" width="1156" height="536" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <rect x="18" y="18" width="1144" height="524" rx="15" fill="none" stroke="#58a6ff" stroke-opacity=".08"/>

    <!-- terminal header -->
    <rect x="28" y="28" width="1124" height="42" rx="9" fill="#11161d" stroke="#30363d"/>
    <circle cx="48" cy="49" r="5" fill="#8b949e"/>
    <circle cx="66" cy="49" r="5" fill="#8b949e"/>
    <circle cx="84" cy="49" r="5" fill="#8b949e"/>
    <text x="110" y="55" class="mono small">hanshit@cse ~ % ./profile</text>
    <circle cx="1018" cy="49" r="4" fill="#58a6ff" filter="url(#glow)"/>
    <text x="1035" y="55" class="mono accent" font-size="14">BUILDING</text>

    <!-- panels -->
    <rect x="28" y="88" width="480" height="420" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="528" y="88" width="624" height="420" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="28" y="88" width="480" height="420" rx="14" fill="url(#halo)" opacity=".32" clip-path="url(#leftPanel)"/>
    <rect x="528" y="88" width="624" height="420" rx="14" fill="url(#halo)" opacity=".42" clip-path="url(#rightPanel)"/>

    <!-- left identity -->
    <text x="52" y="121" class="mono label">IDENTITY / HANSHiT</text>
    <text x="52" y="176" class="mono value">HANSHiT SINGH</text>
    <text x="52" y="207" class="mono small accent">CSE STUDENT / DEVELOPER</text>
    <line x1="52" y1="230" x2="484" y2="230" stroke="#30363d"/>
    <text x="52" y="263" class="mono label">FOCUS</text>
    <text x="52" y="291" class="mono small">Web Development</text>
    <text x="52" y="316" class="mono small">C Programming</text>
    <text x="52" y="341" class="mono small">JavaScript</text>
    <text x="52" y="366" class="mono small">Computer Science</text>
    <text x="52" y="407" class="mono label">MODE</text>
    <text x="52" y="437" class="mono small">Learning → Building</text>
    <text x="52" y="462" class="mono small">Testing → Securing</text>
    <text x="52" y="487" class="mono small">Improving → Repeating</text>

    <!-- right builder -->
    <text x="554" y="121" class="mono label">PROFILE / BUILDER</text>
    <text x="554" y="160" class="mono small"><tspan class="dim">Education:</tspan> Polytechnic Computer Science</text>
    <text x="554" y="187" class="mono small"><tspan class="dim">Builds:</tspan> Student tools · Web projects</text>
    <text x="554" y="214" class="mono small"><tspan class="dim">Explores:</tspan> AI · UI/UX · Git &amp; GitHub</text>
    <text x="554" y="260" class="mono label">SELECTED WORK</text>
    <text x="554" y="290" class="mono small"><tspan class="accent">01</tspan> Student Resource Hub</text>
    <text x="554" y="318" class="mono small"><tspan class="accent">02</tspan> SKH Cast+ Weather Dashboard</text>
    <text x="554" y="346" class="mono small"><tspan class="accent">03</tspan> C Student Record Manager</text>
    <text x="554" y="374" class="mono small"><tspan class="accent">04</tspan> Jems AI</text>
    <text x="554" y="402" class="mono small"><tspan class="accent">05</tspan> Student Study Planner</text>
    <line x1="554" y1="428" x2="1124" y2="428" stroke="#30363d"/>
    <text x="554" y="458" class="mono label">QUALITY</text>
    <text x="554" y="485" class="mono small">Build → Test → Secure → Document</text>

    <!-- depth accents -->
    <path d="M28 326H1152" stroke="#58a6ff" stroke-width="2" opacity=".18"/>
    <path d="M28 507H1152" stroke="url(#line)" opacity=".35"/>
    <g opacity=".7">
      <circle cx="1118" cy="492" r="2" fill="#58a6ff"/>
      <circle cx="1130" cy="492" r="2" fill="#58a6ff" opacity=".5"/>
      <circle cx="1142" cy="492" r="2" fill="#58a6ff" opacity=".25"/>
    </g>

    <!-- light sweep: browsers may show this in standalone SVG; GitHub repository rendering intentionally stays static -->
    <path d="M-160 520L230 -40H330L-60 520Z" fill="url(#sweep)" opacity=".1"/>
  </g>
</svg>