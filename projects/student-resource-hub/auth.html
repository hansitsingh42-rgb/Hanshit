<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Student Resource Hub</title><link rel="stylesheet" href="./style.css"></head><body><canvas id="aurora-canvas"></canvas><header class="header"><div class="container nav"><a class="brand" href="./index.html"><span class="brand-mark">SR</span><span>Student Resource Hub</span></a><nav><a href="./resources.html">Resources</a><a href="./features.html">Features</a><a href="./about.html">About</a></nav><div class="nav-actions"><button id="theme-toggle" class="icon-button" type="button">☼</button></div></div></header><main><section class="container section"><div class="auth-dialog glass-card" style="margin:auto"><p class="eyebrow">ACCOUNT</p><h1>Sign in</h1><form id="auth-form" novalidate><label>Email<input id="auth-email" type="email" required autocomplete="email"></label><label>Password<input id="auth-password" type="password" minlength="6" required autocomplete="current-password"></label><button class="primary-button" type="submit">Sign in</button><p id="auth-status" class="form-status"></p></form><div class="auth-divider"><span>or continue with</span></div><div class="oauth-grid"><button class="oauth-button" type="button" data-oauth="Google">Google</button><button class="oauth-button" type="button" data-oauth="GitHub">GitHub</button></div><p class="auth-note">This GitHub Pages preview demonstrates the interface. Real authentication belongs to the separate full-stack application.</p></div></section></main><script src="./script.js" defer></script></body></html>
