<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Student Resource Hub</title><link rel="stylesheet" href="./style.css"></head><body><canvas id="aurora-canvas"></canvas><header class="header"><div class="container nav"><a class="brand" href="./index.html"><span class="brand-mark">SR</span><span>Student Resource Hub</span></a><nav><a href="./resources.html">Resources</a><a href="./features.html">Features</a><a href="./about.html">About</a></nav><div class="nav-actions"><button id="theme-toggle" class="icon-button" type="button">☼</button><a class="outline-button" href="./auth.html">Sign in</a></div></div></header><main><section class="container section"><div class="contact-card glass-card"><div><p class="eyebrow">CONTACT</p><h1>Have a resource or suggestion?</h1><p>Send a message through this frontend demo.</p></div><form id="contact-form" novalidate><label>Name<input id="contact-name" name="name" required minlength="2"></label><label>Email<input id="contact-email" name="email" type="email" required></label><label>Message<textarea id="contact-message" name="message" rows="5" required minlength="10"></textarea></label><button class="primary-button" type="submit">Send message</button><p id="form-status" class="form-status"></p></form></div></section></main><script src="./script.js" defer></script></body></html>
