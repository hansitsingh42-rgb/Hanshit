<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="description" content="Create email campaign content"><link rel="stylesheet" href="../styles.css"><title>Email Content — Email Campaign Builder</title></head>
<body><main class="section"><div class="container"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>Email Builder</span></a>
<div class="page-head"><div><p class="eyebrow">Step 2 of campaign creation</p><h1 class="page-title">Build your email</h1><p class="hero-text">Choose a safe starting template, edit the content, and preview the message before production delivery.</p></div></div>
<div class="editor-layout"><section class="form-shell"><h2>Content</h2><form id="email-editor-form" class="campaign-form" novalidate>
<label for="template">Template</label><select id="template" required><option value="">Choose a template</option><option>Product announcement</option><option>Newsletter</option><option>Welcome email</option></select>
<label for="headline">Headline</label><input id="headline" type="text" maxlength="120" required placeholder="A clear message for your audience">
<label for="body">Message</label><textarea id="body" maxlength="3000" rows="10" required placeholder="Write the main email message..."></textarea>
<label for="cta">Button text</label><input id="cta" type="text" maxlength="40" placeholder="Learn more">
<p id="editor-message" class="form-message" role="status" aria-live="polite"></p><div class="form-actions"><a class="button button-secondary" href="./campaign-new.html">Back</a><button class="button" type="submit">Preview email</button></div></form></section>
<aside class="preview-card" aria-label="Email preview"><p class="eyebrow">Live preview</p><div class="email-preview"><div class="preview-logo">Email Builder</div><h2 id="preview-headline">Your headline appears here</h2><p id="preview-body">Your email message will appear here as you type.</p><button id="preview-cta" type="button" disabled>Learn more</button></div></aside></div></div></main><script src="./email-editor.js" defer></script></body></html>
