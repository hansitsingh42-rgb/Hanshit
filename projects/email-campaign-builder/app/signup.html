<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Create a secure Email Campaign Builder account">
<link rel="stylesheet" href="../styles.css"><title>Create Account — Email Campaign Builder</title>
</head>
<body><main class="auth-page"><section class="auth-card" aria-labelledby="signup-title">
<a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>Email Builder</span></a>
<p class="eyebrow">Start your trial</p><h1 id="signup-title">Create your account.</h1>
<p class="auth-copy">Set up your campaign workspace and start building email campaigns.</p>
<form id="signup-form" novalidate>
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
<button class="button" type="submit">Create account</button>
</form>
<p class="auth-note">Your password is hashed server-side and is never stored in the browser.</p>
<p class="auth-note"><a href="./login.html">Already have an account? Sign in</a></p>
</section></main><script src="./signup.js" defer></script></body></html>
