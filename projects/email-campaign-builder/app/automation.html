<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="description" content="Build automated email campaign workflows"><link rel="stylesheet" href="../styles.css"><title>Automation — Email Campaign Builder</title></head>
<body><main class="section"><div class="container"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>Email Builder</span></a>
<div class="page-head"><div><p class="eyebrow">Step 4 of campaign setup</p><h1 class="page-title">Automation workflows</h1><p class="hero-text">Build a clear sequence of campaign steps. Production triggers and email delivery stay disabled until the secure backend stage.</p></div><a class="button" href="./campaigns.html">Back to campaigns</a></div>
<div class="automation-layout"><section class="form-shell"><h2>Workflow builder</h2><form id="automation-form" class="campaign-form" novalidate>
<label for="trigger">Start trigger</label><select id="trigger" required><option value="">Choose a trigger</option><option>New subscriber</option><option>Audience segment added</option><option>Campaign engagement</option></select>
<label for="delay">Delay</label><select id="delay" required><option value="">Choose a delay</option><option>Immediately</option><option>1 day</option><option>3 days</option><option>7 days</option></select>
<label for="action">Action</label><select id="action" required><option value="">Choose an action</option><option>Send campaign email</option><option>Wait for engagement</option><option>Move to another segment</option></select>
<p id="automation-message" class="form-message" role="status" aria-live="polite"></p><button class="button" type="submit">Add workflow step</button>
</form></section>
<section class="form-shell"><h2>Workflow</h2><div id="workflow" class="workflow" aria-live="polite"><div class="workflow-step"><span class="workflow-number">1</span><div><strong>Choose a trigger</strong><p>Your automation starts here.</p></div></div></div></section></div></div></main><script src="./automation.js" defer></script></body></html>
