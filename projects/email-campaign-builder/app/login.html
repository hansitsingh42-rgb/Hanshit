<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="description" content="Secure customer login for Email Campaign Builder"><link rel="stylesheet" href="../styles.css"><title>Customer Login — Email Campaign Builder</title></head><body><main class="auth-page"><section class="auth-card" aria-labelledby="login-title"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>Email Builder</span></a><p class="eyebrow">Customer access</p><h1 id="login-title">Welcome back.</h1><p class="auth-copy">Sign in to manage your email campaigns, audiences, automations, and analytics.</p><form id="login-form" novalidate><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><p id="form-message" class="form-message" role="alert" aria-live="polite"></p><button class="button" type="submit">Sign in</button></form><p class="auth-note">Authentication backend is not connected in this stage. No credentials are transmitted or stored by this frontend.</p></section></main><script src="./login.js" defer></script></body></html>
