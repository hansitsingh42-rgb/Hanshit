<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C Student Record Manager — Live Demo</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18213f,#080b14 60%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:32px 18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.14em;opacity:.65}.head h1{margin:6px 0;font-size:clamp(24px,5vw,40px)}.badge{padding:8px 12px;border:1px solid #34405f;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}.card{background:#11182b;border:1px solid #293552;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0004}.form{display:grid;gap:12px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #35415f;background:#0b1020;color:#fff}button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700;background:#dbe5ff;color:#0b1020}button.secondary{background:#202b46;color:#eef2ff}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #293552;font-size:14px}.empty{opacity:.55;text-align:center;padding:30px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:20px;font-size:13px;opacity:.8}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="eyebrow">LIVE WEB DEMO / C PROJECT</div><h1>Student Record Manager</h1><p>Browser demonstration of the same core record-management workflow as the C console project.</p></div><span class="badge">C • Structures • CRUD</span></header>
<section class="grid"><article class="card"><h2>Add Student</h2><form class="form" id="form"><input id="id" type="number" min="1" placeholder="Student ID" required><input id="name" placeholder="Student name" required><input id="course" placeholder="Course" required><input id="marks" type="number" min="0" max="100" placeholder="Marks (0–100)" required><button>Add Record</button><div class="status" id="status"></div></form></article>
<article class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Records</h2><div class="actions"><button class="secondary" id="clear">Clear All</button></div></div><div id="table"></div></article></section></main>
<script>
const key='c-student-record-demo';let records=JSON.parse(localStorage.getItem(key)||'[]');
const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(records));render()}
function render(){if(!records.length){$('table').innerHTML='<div class="empty">No records yet. Add a student to test the demo.</div>';return} $('table').innerHTML='<table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Marks</th><th></th></tr></thead><tbody>'+records.map(r=>`<tr><td>${r.id}</td><td>${esc(r.name)}</td><td>${esc(r.course)}</td><td>${r.marks}</td><td><button class="secondary" onclick="removeRecord(${r.id})">Delete</button></td></tr>`).join('')+'</tbody></table>'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function removeRecord(id){records=records.filter(r=>r.id!==id);save()}$('form').addEventListener('submit',e=>{e.preventDefault();const id=Number($('id').value),name=$('name').value.trim(),course=$('course').value.trim(),marks=Number($('marks').value);if(records.some(r=>r.id===id)){$('status').textContent='Student ID already exists.';return}records.push({id,name,course,marks});save();e.target.reset();$('status').textContent='Record added successfully.'});$('clear').onclick=()=>{if(records.length){records=[];save();$('status').textContent='All records cleared.'}};render();
</script></body></html>
