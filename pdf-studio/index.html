<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PDF Studio — browser document editor and PDF workspace."><title>PDF Studio</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">P</span><div><strong>PDF Studio</strong><small>Document workspace</small></div></div>
<div class="toolbar"><button data-action="new">New</button><button data-action="import">Import PDF</button><button data-action="undo" disabled>Undo</button><button data-action="redo" disabled>Redo</button><span class="divider"></span><button data-action="zoom-out">−</button><span id="zoom">100%</span><button data-action="zoom-in">+</button><button class="primary" data-action="export">Export PDF</button></div></header>
<main class="workspace"><aside class="sidebar"><div class="side-head"><span>Pages</span><div class="head-actions"><button data-action="add-page" aria-label="Add page">+</button><button data-action="duplicate-page" aria-label="Duplicate page">⧉</button></div></div><div id="pages" class="pages"></div><div class="side-bottom"><button data-action="move-up">Move page up</button><button data-action="move-down">Move page down</button><button data-action="upload-image">Add image</button><button data-action="delete-page">Delete page</button><button data-action="clear">Clear document</button></div></aside>
<section class="editor"><div class="editor-head"><div><span class="eyebrow">EDITOR</span><h1 id="doc-title">Untitled document</h1></div><div class="status" id="status">Ready</div></div><div class="canvas-wrap"><div id="page" class="paper" contenteditable="true" spellcheck="true" aria-label="PDF page editor"></div><div id="pdf-render-layer" class="pdf-render-layer" hidden></div></div></section>
<aside class="inspector"><div class="inspector-head">Properties</div><label>Document title<input id="title-input" value="Untitled document"></label><label>Text style<select id="text-style"><option value="p">Paragraph</option><option value="h2">Heading</option><option value="h3">Subheading</option></select></label><div class="quick-grid"><button data-format="bold"><b>B</b></button><button data-format="italic"><i>I</i></button><button data-format="underline"><u>U</u></button><button data-format="insertUnorderedList">List</button></div>
<div class="tool-section"><strong>Insert</strong><div class="tool-grid"><button data-action="insert-table">Table</button><button data-action="insert-page-break">Page break</button><button data-action="insert-line">Divider</button><button data-action="insert-link">Link</button></div></div>
<div class="panel"><strong>Phase 2</strong><p>Page duplication, reorder/delete, tables, links, dividers, image insertion and richer document controls are now available. Native PDF parsing and object-level editing are next.</p></div></aside></main>
<input id="file-input" type="file" accept="application/pdf,image/*" hidden><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs" type="module"></script><script type="module" src="./pdf-engine.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script type="module" src="./pdf-engine.js"></script><script src="./app.js"></script></body></html>
